spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:configtree:/run/secrets/
  application:
    name: animeRecommendationSystem
  web:
    resources:
      # Static files (css, js, images, favicon) may be cached for a month. Without this Spring Security sends
      # "Cache-Control: no-store" for every file and browsers download the css, the scripts and the 2 MB header
      # photo again on every page view.
      cache:
        cachecontrol:
          max-age: 30d
          cache-public: true
      # Everything below /assets/** is served under a name that contains a hash of the file content
      # (main-<hash>.css, links written by Thymeleaf's @{...} are rewritten automatically), so a changed file
      # gets a new URL and is never served stale, however long the old one is cached.
      chain:
        strategy:
          content:
            enabled: true
            paths: /assets/**
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 540000
      max-lifetime: 600000
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

# Production logging configuration
logging:
  level:
    root: WARN
    cz:
      kocabek:
        animerecomedationsystem: INFO
    org:
      springframework:
        web: WARN
        security: WARN
      hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator endpoints - restricted for production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

# Security headers
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/json,application/javascript
  http2:
    enabled: true
  shutdown: graceful
  # The app runs behind a reverse proxy (nginx, Cloudflare) that terminates TLS. Honour X-Forwarded-Proto/Host
  # so that redirects and absolute URLs use https instead of the plain http the app sees.
  # Only correct while port 8080 is reachable through the proxy alone (bind it to 127.0.0.1).
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # The session cookie is only sent over https. SESSION_COOKIE_SECURE=false allows the prod profile
        # to be tried over plain http (e.g. on localhost); never do that on a public server.
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring.lifecycle:
  timeout-per-shutdown-phase: 30s
